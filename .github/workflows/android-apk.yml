name: Android APK

# Baut die LoxPanel-Server-APK bei jedem v*-Tag (und manuell) und haengt sie an
# den GitHub-Release. Die App-Assets (bin/webfrontend/config) werden dabei vom
# Gradle-Task 'syncLoxpanelAssets' automatisch aus dem Repo generiert — die APK
# ist also immer auf dem aktuellen Repo-Stand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK bauen (Assets kommen per syncLoxpanelAssets aus dem Repo)
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: APK benennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LoxPanel-Server.apk

      - name: An den Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LoxPanel-Server.apk

      - name: APK als Artefakt (auch ohne Tag, z.B. workflow_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: LoxPanel-Server-apk
          path: LoxPanel-Server.apk
