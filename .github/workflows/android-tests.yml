name: Android Tests

on:
  pull_request:
    paths: ["android/**", "bin/sip_call.py", "bin/intercom_talk.py", "bin/webvisu.py", "webfrontend/html/panel.html", "requirements.txt", ".github/workflows/android-tests.yml"]
  push:
    branches: [main]
    paths: ["android/**", "bin/sip_call.py", "bin/intercom_talk.py", "bin/webvisu.py", "webfrontend/html/panel.html", "requirements.txt", ".github/workflows/android-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.7"
      - name: JVM-Tests und Android-Kompilierung
        working-directory: android
        run: gradle testDebugUnitTest compileDebugKotlin --no-daemon --console=plain
