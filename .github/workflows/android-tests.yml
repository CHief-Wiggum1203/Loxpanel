name: Android Tests

on:
  pull_request:
    paths: ["android/**", "bin/sip_call.py", "bin/intercom_talk.py", "bin/webvisu.py", "webfrontend/html/panel.html", "requirements.txt", ".github/workflows/android-tests.yml"]
  push:
    branches: [main]
    paths: ["android/**", "bin/sip_call.py", "bin/intercom_talk.py", "bin/webvisu.py", "webfrontend/html/panel.html", "requirements.txt", ".github/workflows/android-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: JVM-Tests und Android-Kompilierung
        working-directory: android
        run: gradle testDebugUnitTest compileDebugKotlin --no-daemon --console=plain
