name: Android Tests

on:
  pull_request:
    paths: ["android/**", "bin/sip_call.py", "bin/intercom_talk.py", "bin/webvisu.py", "webfrontend/html/panel.html", "requirements.txt", ".github/workflows/android-tests.yml"]
  push:
    branches: [main]
    paths: ["android/**", "bin/sip_call.py", "bin/intercom_talk.py", "bin/webvisu.py", "webfrontend/html/panel.html", "requirements.txt", ".github/workflows/android-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.7"
      - name: JVM-Tests und Android-Kompilierung
        working-directory: android
        run: gradle testDebugUnitTest compileDebugKotlin --no-daemon --console=plain
