name: Plugin Release

# Baut das LoxBerry-Plugin-ZIP (Inhalt von loxberry-plugin/ im ZIP-Root) und
# haengt es an das GitHub-Release. release.cfg -> ARCHIVEURL zeigt auf
# .../releases/latest/download/loxpanel-plugin.zip.
#
# Ausgeloest vom Tag v*, wie APK (android-apk.yml) und .deb (deb.yml). Frueher
# hing der Lauf an `release: published`. Legt aber einer der beiden anderen
# Workflows das Release an (softprops/action-gh-release mit GITHUB_TOKEN),
# loest GitHub dafuer keinen weiteren Workflow aus: Das ZIP fehlte, und
# LoxBerry faende unter ARCHIVEURL nichts. Ein Release aus der Oberflaeche
# ("Create new tag on publish") legt den Tag an und kommt so ebenfalls hier an.
#
# Die Release-Notizen sind der Eintrag der Version im Changelog der README
# (tests/test_release.py prueft, dass es ihn gibt).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Plugin-ZIP bauen
        run: |
          cd loxberry-plugin
          zip -r ../loxpanel-plugin.zip . -x '*.DS_Store' '*/.gitkeep'
          cd ..
          unzip -l loxpanel-plugin.zip | head -30

      - name: Release-Notizen aus dem Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v kopf="- **${version}** – " \
            'index($0, kopf) == 1 { print substr($0, length(kopf) + 1); exit }' \
            README.md > release-notes.md
          if [ -s release-notes.md ]; then
            cat release-notes.md
          else
            echo "::warning::Kein Eintrag für ${version} im Changelog der README, das Release bleibt ohne Notizen."
          fi

      - name: An Release anhaengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: loxpanel-plugin.zip
          body_path: release-notes.md

      - name: Als Artefakt hochladen (bei manuellem Lauf)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loxpanel-plugin
          path: loxpanel-plugin.zip
