name: Tests und Image

# Prueft jeden Pull Request, jeden Push auf main und jeden v*-Tag: Syntax,
# Lint (nur Fehlerregeln), Tests gegen einen Miniserver-Nachbau, Rauchtest des
# Servers, Visu-/Konfigurator-Tests in Chromium. Pull Requests bauen das Image
# zur Probe (ohne Push). Auf main und bei v*-Tags veroeffentlicht der Job
# "veroeffentlichen" danach das Image nach GHCR, aber nur, wenn alle
# Pruef-Jobs DIESES Laufs (also desselben Commits) gruen sind. Einen eigenen
# Docker-Workflow gibt es dafuer nicht mehr: Er lief neben den Tests her und
# war fertig, bevor sie es waren. tests/test_workflows.py wacht darueber.
# Lokal dasselbe: pip install -r requirements-dev.txt, dann pytest.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Pull Requests: ein neuer Push bricht den alten Lauf ab. Auf main und bei
# Tags nicht, dort warten die Laeufe aufeinander: So setzt jeder gruene Commit
# `latest` der Reihe nach und verliert sein Image nicht, nur weil schon der
# naechste gepusht ist. GitHub laesst je Gruppe nur EINEN Lauf warten; kommen
# waehrend eines Laufs zwei Pushes, entfaellt der Lauf des ersten davon.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefen:
    name: Syntax, Lint, Tests
    runs-on: ubuntu-latest
    # Oktober 2026 rund 1 min. Die Grenze haelt einen haengenden Lauf auf,
    # bevor er die Laeufe auf main stundenlang warten laesst (GitHub-Standard
    # sind 360 min).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # wie im Image (Dockerfile)
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhaengigkeiten
        run: pip install -r requirements-dev.txt

      - name: Syntax (Python, Workflows, Unraid-Vorlage)
        run: |
          python -m py_compile bin/*.py agent/loxpanel-agent.py
          python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"
          python -c "import xml.dom.minidom as m; m.parse('unraid/loxpanel.xml')"

      - name: Lint (Fehlerregeln)
        run: ruff check --select F,E9 bin agent tests

      - name: Tests und Rauchtest
        run: pytest -m "not browser" --basetemp="${{ runner.temp }}/pytest"

  visu:
    name: Visu und Konfigurator (Chromium)
    runs-on: ubuntu-latest
    # Oktober 2026 rund 10 bis 13 min, mit Luft fuer weitere Tests; Grund
    # wie oben.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhaengigkeiten und Chromium
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Browser-Tests
        run: pytest -m browser --basetemp="${{ runner.temp }}/pytest"

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/pytest/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  image:
    name: Image bauen (amd64, ohne Push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

  veroeffentlichen:
    name: Image veroeffentlichen (GHCR)
    # Laeuft erst, wenn pruefen UND visu gruen sind. Das `if` enthaelt
    # bewusst keine Statusfunktion (always(), success(), failure(),
    # cancelled()): Dann gilt implizit success(), und ein roter oder
    # abgebrochener Test-Job ueberspringt diesen Job. Nur bei Push und
    # manuellem Start, nur von main und v*-Tags; Pull Requests bauen oben im
    # Job "image" ohne Push.
    needs: [pruefen, visu]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # Optional: PAT mit Scope write:packages als Repo-Secret GHCR_TOKEN
          # hinterlegen. Fehlt es, reicht das GITHUB_TOKEN des Workflows
          # (packages: write), solange das Package mit diesem Repo verknuepft ist
          # (passiert beim ersten Push aus einem Workflow des Repos automatisch).
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Commit fuer bin/version.json (Anzeige im Konfigurator)
          build-args: LOXPANEL_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
